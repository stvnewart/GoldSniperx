
name: Build GoldSniperX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build cTrader bot
        run: dotnet build GoldSniperX.csproj --configuration Release -p:AlgoBuild=true -p:AlgoPublish=false

      - name: Save compiled cBot
        uses: actions/upload-artifact@v4
        with:
          name: GoldSniperX-algo
          path: '**/GoldSniperX.algo'
          if-no-files-found: error
